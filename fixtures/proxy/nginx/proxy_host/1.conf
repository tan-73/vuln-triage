# ------------------------------------------------------------
# git.example.com  (Nginx Proxy Manager style generated config)
# ------------------------------------------------------------
server {
  set $forward_scheme http;
  set $server         "gitea";
  set $port           3000;

  listen 80;
  listen [::]:80;
  listen 443 ssl;
  listen [::]:443 ssl;

  server_name git.example.com;

  location / {
    include conf.d/include/proxy.conf;
  }
}
