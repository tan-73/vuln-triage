# grafana.home.arpa: LAN only (private client ranges, everything else denied)
server {
  set $forward_scheme http;
  set $server         "192.168.50.10";
  set $port           3000;

  listen 80;
  server_name grafana.home.arpa;

  allow 192.168.0.0/16;
  allow 10.0.0.0/8;
  deny all;

  location / {
    include conf.d/include/proxy.conf;
  }
}
