[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vulntriage"
version = "0.1.0"
description = "AI-assisted vulnerability triage for self-hosted Linux homelabs: scan, enrich, rank by real-world risk, explain."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Tanmay" }]
keywords = ["security", "vulnerability", "trivy", "epss", "kev", "homelab", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0.30,<2.1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.7,<3",
    "httpx>=0.27,<1",
    "typer>=0.12,<1",
    "jinja2>=3.1,<4",
    "apscheduler>=3.10,<4",
    "pyyaml>=6,<7",
    "markdown-it-py>=3,<5",
    "rich>=13",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
gemini = ["google-genai>=1.0"]
openai = ["openai>=1.40"]
postgres = ["psycopg[binary]>=3.2"]
llm = ["vulntriage[anthropic,gemini,openai]"]
dev = [
    "vulntriage[llm]",
    "pytest>=8",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[project.scripts]
vulntriage = "vulntriage.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["vulntriage"]

[tool.hatch.build.targets.wheel.force-include]
"fixtures" = "vulntriage/_fixtures"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:vulntriage.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF"]
allowed-confusables = ["×", "→", "≥", "–"]
ignore = [
    "S101",   # assert is fine in tests
    "S603",   # subprocess without shell=True is what we want
    "RUF012", # mutable class attrs on pydantic/sqlalchemy models are fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011", "E501"]
"scripts/**" = ["E501", "T201"]
"vulntriage/evaluation.py" = ["E501"]  # long Markdown table rows

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
